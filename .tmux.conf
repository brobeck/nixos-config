##### BASICS #####

# Use 256 colors / true color
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# change prefix
set -g prefix C-Space

# Faster key response
set -sg escape-time 0

# Mouse support (scroll, resize, select panes)
set -g mouse on

# remove ctrl l to crear screen to not interfer with vim-tmux-navigator
set -g @vim_navigator_prefix_mapping_clear_screen ""

bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session

##### INDEXING #####

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# -- Status Bar ---------------------------------------------
set -g status-position top
set -g status-justify left
set -g status-interval 1
set -g status-left "#[underscore]#{session_name}#[nounderscore] "
set -g status-left-length 50
set -g status-right "#{?client_prefix,#[bg=red] PREFIX #[default],} %Y.%m.%d %a %H:%M:%S"
set -g status-right-length 50

# -- Theme
set -g status-style bg=default,fg=white
set -g pane-border-style fg=colour237
set -g pane-active-border-style fg=white
set -g message-style bg=black,fg=white

set -g window-status-format "#[fg=white,bg=default]#I"
set -g window-status-current-format "#[fg=white,bg=default,bold][#I]"

# Sesh jumping with prefix t
unbind-key t

bind-key t run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
bind-key L run-shell "sesh last"

# passthru to clear screen cause vim-tmux-navigator eats the native
bind C-l send-keys C-l

# -- Plugins -----------------------------------------------
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Other plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager
# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'

